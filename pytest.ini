[pytest]
testpaths = tests
pythonpath = .
# norecursedirs 必须把 pytest 的默认值抄全，否则默认值会被这一项覆盖掉。
# 额外排除 workspace：沙箱里存放着 Agent 真实生成的 test_main.py，
# 被收集会真的执行代码（甚至访问网络）。
norecursedirs = workspace .* *.egg build dist node_modules venv {arch} _darcs CVS
addopts = -ra --strict-markers
markers =
    local: 依赖本机 workspace 下的历史任务目录，CI 上会 skip