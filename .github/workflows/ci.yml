name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 测试会拉起沙箱子进程，卡住时必须止损（默认 360 分钟太长）
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与本地一致；crewai 要求 >=3.10,<3.14
          python-version: "3.11"
          # 缓存 pip wheel（依赖树约 700MB，省下载不省解包）
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # local 用例依赖本机 workspace 历史任务，CI 上不存在，排除掉
        run: python -m pytest -q -m "not local" --durations=10
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"